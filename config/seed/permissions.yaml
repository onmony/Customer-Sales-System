# Default System Permissions Configuration
# 
# This file is used ONLY during bootstrap to initialize the database with default permissions.
# After bootstrap, the database becomes the source of truth for all permission data.
# 
# DO NOT modify this file to change permissions in production. Use the Role Management UI instead.
# 
# Bootstrap Process:
# 1. Read this file on first application startup
# 2. Create permissions defined below
# 3. Mark bootstrap complete
# 4. Database becomes source of truth

permissions:
  # Customer Permissions
  - name: customer.view
    description: View customer details
    domain: customer
  
  - name: customer.create
    description: Create new customers
    domain: customer
  
  - name: customer.edit
    description: Edit customer details
    domain: customer
  
  - name: customer.delete
    description: Delete customers
    domain: customer
  
  - name: customer.list
    description: List customers
    domain: customer
  
  - name: customer.history
    description: View customer history
    domain: customer
  
